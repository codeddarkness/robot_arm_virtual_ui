<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4DoF Robot Arm Controller v0.2.3-1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Base Styles */
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        /* Layout */
        .container { 
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto;
            padding: 15px;
        }
        
        /* Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
            text-align: center;
            width: 100%;
        }
        .version { 
            font-size: 0.8em; 
            color: #666;
            padding: 3px 8px;
            background-color: #e9e9e9;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .version a {
            text-decoration: none;
            background-color: #4a89dc;
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .version a:hover {
            background-color: #3a79cc;
        }
        
        /* 3D Model Container - TALLER */
        .model-container { 
            width: 100%;
            height: min(75vh, 600px); /* Made taller */
            margin-bottom: 20px; 
            border: 1px solid #ccc; 
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }
        .zoom-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid #ccc;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .zoom-button:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        /* Control Section */
        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .controls h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .controls h3 {
            color: #333;
            text-align: center;
            margin-bottom: 15px;
        }
        
        /* Slider Controls */
        .sliders-container { 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .slider-group { 
            display: flex; 
            align-items: center;
            flex: 1 1 200px; 
            min-width: 200px;
            background-color: #f8f8f8;
            padding: 10px;
            border-radius: 6px;
        }
        .servo-label { 
            width: 60px;
            font-weight: bold;
            color: #555;
        }
        .angle-display { 
            width: 50px; 
            text-align: right; 
            padding-right: 10px;
            font-family: monospace;
            font-size: 1.1em;
        }
        input[type="range"] { 
            flex-grow: 1;
            height: 6px;
        }
        
        /* Joystick Controls */
        .joysticks-container { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-around; 
            margin-bottom: 20px;
            gap: 20px;
        }
        .joystick-wrapper {
            flex: 0 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .joystick { 
            position: relative; 
            width: clamp(100px, 20vw, 150px);
            height: clamp(100px, 20vw, 150px);
            border-radius: 50%; 
            background: #eee;
            border: 3px solid #ddd;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.1);
        }
        .joystick-handle { 
            position: absolute; 
            width: 33%; 
            height: 33%; 
            border-radius: 50%; 
            background: linear-gradient(145deg, #444 0%, #222 100%);
            top: 33%; 
            left: 33%; 
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }
        .joystick-label { 
            text-align: center; 
            margin-top: 10px; 
            font-weight: bold;
            font-size: 0.9em;
            color: #555;
        }
        
        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .sliders-container {
                flex-direction: column;
            }
            .slider-group {
                min-width: unset;
            }
            .joysticks-container {
                flex-direction: column;
                align-items: center;
            }
            .joystick {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>4DoF Robot Arm Controller</h1>
            <span class="version">v0.2.3-1 <a href="/dev">DEV</a></span>
        </div>
        
        <div id="model-container" class="model-container">
            <div class="zoom-controls">
                <button id="zoom-in" class="zoom-button">+</button>
                <button id="zoom-out" class="zoom-button">-</button>
            </div>
        </div>
        
        <div class="controls">
            <h2>Control Panel</h2>
            
            <!-- Slider Controls -->
            <h3>Manual Controls</h3>
            <div class="sliders-container">
                <div class="slider-group">
                    <span class="servo-label">Servo 0:</span>
                    <span id="angle0" class="angle-display">135°</span>
                    <input type="range" id="channel0" min="0" max="270" value="135">
                </div>
                <div class="slider-group">
                    <span class="servo-label">Servo 1:</span>
                    <span id="angle1" class="angle-display">135°</span>
                    <input type="range" id="channel1" min="0" max="270" value="135">
                </div>
                <div class="slider-group">
                    <span class="servo-label">Servo 2:</span>
                    <span id="angle2" class="angle-display">135°</span>
                    <input type="range" id="channel2" min="0" max="270" value="135">
                </div>
                <div class="slider-group">
                    <span class="servo-label">Servo 3:</span>
                    <span id="angle3" class="angle-display">135°</span>
                    <input type="range" id="channel3" min="0" max="270" value="135">
                </div>
            </div>
            
            <!-- Joystick Controls -->
            <h3>Joystick Controls</h3>
            <div class="joysticks-container">
                <div class="joystick-wrapper">
                    <div id="left-joystick" class="joystick">
                        <div id="left-handle" class="joystick-handle"></div>
                    </div>
                    <div class="joystick-label">Left Joystick<br>X: Ch0, Y: Ch1</div>
                </div>
                <div class="joystick-wrapper">
                    <div id="right-joystick" class="joystick">
                        <div id="right-handle" class="joystick-handle"></div>
                    </div>
                    <div class="joystick-label">Right Joystick<br>X: Ch3, Y: Ch2</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/robot_arm.js"></script>
</body>
</html>
